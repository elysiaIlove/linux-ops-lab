# opslab 练习环境的日志轮转配置
# 注意：logrotate 不支持行内注释，注释必须单独成行
# 放置位置：/etc/logrotate.d/opslab

/root/ops-lab/logs/*.log {
    # 每天轮转一次
    daily
    # 保留 7 份历史（共约 8 天）
    rotate 7
    # 单文件超过 5M 也立即轮转，防止一天内暴涨
    maxsize 5M
    # 文件不存在不报错
    missingok
    # 空文件不轮转
    notifempty
    # 历史日志 gzip 压缩
    compress
    # 最近一份先不压缩，便于 tail 查看
    delaycompress
    # 先复制再清空原文件，避免进程持有句柄导致日志写丢
    # （支持重开日志句柄的程序如 nginx 应改用 postrotate + 信号）
    copytruncate
    # 新日志文件的权限与属主
    create 0644 root root
    # 用日期做后缀（health.log-20261008）
    dateext
    # 日期格式
    dateformat -%Y%m%d
    # 以 root 身份操作（日志目录属主是 root）
    su root root
}
